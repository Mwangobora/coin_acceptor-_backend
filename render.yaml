# Render Blueprint — source of truth for this service's config.
# Edit this file + git push to change env vars. No dashboard editing needed
# for anything below marked with a literal `value`.
#
# Vars marked `sync: false` are real secrets (JWT keys, DB URL, device
# encryption key, webhook secret). Blueprint sync deliberately leaves these
# alone — regenerating them would invalidate live user sessions or make
# already-encrypted device credentials undecryptable. Set them once in the
# Render dashboard (Environment tab); they will not be touched again by
# future syncs of this file.
services:
  - type: web
    name: coin-acceptor-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: charging-system-api
      - key: NODE_ENV
        value: development # mock QR provider only; see docs/database.md payments note
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "4000"
      - key: API_PREFIX
        value: api/v1
      - key: FRONTEND_URL
        value: https://coin-web-weld.vercel.app
      - key: CORS_ORIGIN
        value: https://coin-web-weld.vercel.app
      - key: PUBLIC_CUSTOMER_WEB_ORIGIN
        value: https://coin-web-weld.vercel.app
      - key: SWAGGER_ENABLED
        value: "true"
      - key: COOKIE_SECURE
        value: "true" # Render terminates TLS; cookies must be Secure regardless of NODE_ENV
      - key: COOKIE_SAME_SITE
        value: lax
      - key: DEVICE_AUTH_ENABLED
        value: "false"
      - key: REQUEST_SIZE_LIMIT
        value: 1mb
      - key: JWT_ACCESS_TTL
        value: 7d
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: AUTH_MAX_FAILED_ATTEMPTS
        value: "5"
      - key: AUTH_LOCK_MINUTES
        value: "15"
      - key: AUTH_MIN_PASSWORD_LENGTH
        value: "12"
      - key: DEVICE_HMAC_CLOCK_SKEW_SECONDS
        value: "300"
      - key: DEVICE_EVENT_MAX_FUTURE_SECONDS
        value: "300"
      - key: DEVICE_COMMAND_POLL_LIMIT
        value: "10"
      - key: DEVICE_COMMAND_EXPIRY_INTERVAL_SECONDS
        value: "60"
      - key: QR_PAYMENT_PROVIDER
        value: mock
      - key: QR_PAYMENT_EXPIRY_SECONDS
        value: "300"
      - key: PAYMENT_PENDING_WINDOW_SECONDS
        value: "600"
      # Secrets: set once in the Render dashboard, never overwritten by sync.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: DEVICE_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: QR_MOCK_WEBHOOK_SECRET
        sync: false
